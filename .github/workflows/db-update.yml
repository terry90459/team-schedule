name: 更新 Supabase 資料庫

# supabase/schema.sql 有改動並推到 main 時，自動在 Supabase 執行整份 schema.sql
# （schema.sql 本來就可以重複執行、不刪資料）
# - 整份在同一個交易裡跑：任何一行出錯就停下來、全部復原，不會留下改一半的資料庫
# - 跑完檢查 schema_version() 是否等於檔案最後寫的版本號
# - 需要 GitHub Secret（一定要放在 Secrets，不能放在 Variables；Variables 是公開的），有哪個用哪個，前面的失敗就換下一個：
#   1. SUPABASE_ACCESS_TOKEN（最可靠）：Supabase 帳號的存取權杖（supabase.com/dashboard/account/tokens），走 HTTPS 管理 API
#   2. SUPABASE_DB_PASSWORD：只放資料庫密碼本身；主機、使用者寫在下面（不是機密）
#   3. SUPABASE_DB_URL：Session pooler 的完整連線字串（密碼外不要有方括號）
# - 改了 Secret 後要重跑：Actions → 更新 Supabase 資料庫 → Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - '.github/workflows/db-update.yml'
  workflow_dispatch:

# 同一時間只跑一個，避免兩次更新互相干擾
concurrency:
  group: db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # 專案代碼與 Session pooler 主機（不是機密；可用 repo Variables 覆蓋）
      DB_REF: ${{ vars.SUPABASE_PROJECT_REF || 'groniyjxuhppicudlrjd' }}
      DB_HOST: ${{ vars.SUPABASE_DB_HOST || 'aws-0-ap-southeast-1.pooler.supabase.com' }}
      PGCONNECT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4

      - name: 準備工具
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          command -v jq >/dev/null || sudo apt-get install -y -qq jq
          # 共用函式：sql "查詢" → 印出第一列第一欄；sql_file 檔案 → 整份在交易裡執行
          cat > "$RUNNER_TEMP/db.sh" <<'SH'
          api() {  # 管理 API 執行 SQL，回傳 JSON
            local body resp code
            body=$(jq -Rs '{query: .}' <<< "$1")
            resp=$(curl -sS -w '\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$DB_REF/database/query" \
              -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" --data-binary "$body") || return 1
            code=$(tail -n1 <<< "$resp"); resp=$(sed '$d' <<< "$resp")
            if [ "${code:0:1}" != 2 ]; then echo "HTTP $code $(jq -r '.message // .error // .' <<< "$resp" 2>/dev/null || echo "$resp")" >&2; return 1; fi
            echo "$resp"
          }
          sql() {
            if [ "$MODE" = api ]; then api "$1" | jq -r '.[0] // {} | to_entries[0].value // empty'
            else psql "$PGURL" -v ON_ERROR_STOP=1 -tA -c "$1"; fi
          }
          sql_file() {
            if [ "$MODE" = api ]; then api "$(printf 'begin;\n%s\ncommit;\n' "$(cat "$1")")" >/dev/null
            else psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -q -f "$1"; fi
          }
          SH
          sed -i 's/^          //' "$RUNNER_TEMP/db.sh"

      - name: 選擇連線方式並測試
        run: |
          . "$RUNNER_TEMP/db.sh"
          tried=""
          try() {  # $1 = 方式名稱；成功就寫進 GITHUB_ENV
            local err
            if err=$(sql "select 'ok'" 2>&1 >/dev/null); then
              echo "✓ 連線成功：$1"; return 0
            fi
            err=$(printf '%s' "$err" | sed -E 's#postgres(ql)?://[^ "]*#<連線字串>#g' | tr '\n' ' ' | cut -c1-300)
            if [ "${QUIET:-0}" = 1 ]; then echo "✗ $1：$err"; else echo "::warning::$1 連線失敗：$err"; fi
            tried="$tried $1"; return 1
          }
          if [ -n "$SB_TOKEN" ]; then
            export MODE=api
            if try "SUPABASE_ACCESS_TOKEN（管理 API）"; then echo "MODE=api" >> "$GITHUB_ENV"; exit 0; fi
          fi
          if [ -n "$DB_PASS" ]; then
            export MODE=pass PGUSER="postgres.$DB_REF" PGDATABASE=postgres PGURL="dbname=postgres"
            export PGPASSWORD="$(printf '%s' "$DB_PASS" | tr -d '\r\n')"
            echo "密碼長度：${#PGPASSWORD} 個字元（請對照你設定的密碼）"
            # 依序試：設定的主機、aws-0／aws-1 兩個連線池；5432（session）與 6543（transaction）
            # 剛重設的密碼連線池可能還沒換上，整輪失敗就等 30 秒再試，最多 6 輪（約 3 分鐘）
            region="${DB_HOST#aws-*-}"; region="${region%%.pooler*}"
            hosts=$(printf '%s\n' "$DB_HOST" "aws-0-$region.pooler.supabase.com" "aws-1-$region.pooler.supabase.com" | awk '!seen[$0]++')
            for round in 1 2 3 4 5 6; do
              QUIET=$([ "$round" -lt 6 ] && echo 1 || echo 0)
              for h in $hosts; do for port in 5432 6543; do
                export PGHOST="$h" PGPORT="$port"
                if try "SUPABASE_DB_PASSWORD（$h:$port，第 $round 輪）"; then
                  { echo "MODE=pass"; echo "PGHOST=$PGHOST"; echo "PGPORT=$PGPORT"; echo "PGUSER=$PGUSER"; echo "PGDATABASE=postgres"; echo "PGPASSWORD=$PGPASSWORD"; echo "PGURL=dbname=postgres"; } >> "$GITHUB_ENV"
                  exit 0
                fi
              done; done
              [ "$round" -lt 6 ] && { echo "第 $round 輪全部失敗，30 秒後再試…"; sleep 30; }
            done
            unset PGHOST PGPORT PGUSER PGDATABASE PGPASSWORD
          fi
          if [ -n "$DB_URL" ]; then
            export MODE=url PGURL="$DB_URL"
            if try "SUPABASE_DB_URL"; then { echo "MODE=url"; echo "PGURL=$DB_URL"; } >> "$GITHUB_ENV"; exit 0; fi
          fi
          if [ -z "$tried" ]; then
            echo "::error::還沒設定任何 Secret。建議到 supabase.com/dashboard/account/tokens 產生存取權杖，存成 GitHub Secret「SUPABASE_ACCESS_TOKEN」。"
          else
            echo "::error::所有連線方式都失敗（${tried# }）。最可靠的是 SUPABASE_ACCESS_TOKEN：supabase.com/dashboard/account/tokens → Generate new token。"
          fi
          exit 1

      - name: 執行 schema.sql（單一交易，出錯全部復原）
        run: |
          . "$RUNNER_TEMP/db.sh"
          echo "連線方式：$MODE　執行前版本：$(sql 'select public.schema_version()' 2>/dev/null || echo '舊版')"
          if ! out=$(sql_file supabase/schema.sql 2>&1); then
            echo "$out"
            echo "::error::schema.sql 執行失敗，資料庫已全部復原（沒有任何改動）：$(printf '%s' "$out" | grep -iE 'error|錯誤|HTTP' | head -3 | tr '\n' ' ' | cut -c1-500)"
            exit 1
          fi

      - name: 確認版本號
        run: |
          . "$RUNNER_TEMP/db.sh"
          want=$(grep -oE 'select [0-9]+ \$\$;' supabase/schema.sql | tail -1 | grep -oE '[0-9]+')
          got=$(sql 'select public.schema_version()')
          echo "檔案版本：$want　資料庫版本：$got"
          if [ "$want" != "$got" ]; then echo "::error::版本號不一致（檔案 $want，資料庫 $got）"; exit 1; fi
          # 請 Supabase API（PostgREST）重新讀取資料表結構，新的檢視表／函式馬上可以用
          sql "notify pgrst, 'reload schema'" >/dev/null || true
          echo "::notice::資料庫已更新到 v$got（連線方式：$MODE${PGHOST:+，$PGHOST:$PGPORT}）"
