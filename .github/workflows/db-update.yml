name: 更新 Supabase 資料庫

# supabase/schema.sql 有改動並推到 main 時，自動在 Supabase 執行整份 schema.sql
# （schema.sql 本來就可以重複執行、不刪資料）
# - 整份在同一個交易裡跑：任何一行出錯就停下來、全部復原，不會留下改一半的資料庫
# - 跑完檢查 schema_version() 是否等於檔案最後寫的版本號
# - 需要 GitHub Secret：SUPABASE_DB_URL（Supabase → Connect → Session pooler 的連線字串，含資料庫密碼）
#   一定要放在 Secrets，不能放在 Variables（Variables 是公開的）
# - 改了 Secret 後要重跑：Actions → 更新 Supabase 資料庫 → Run workflow
on:
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - '.github/workflows/db-update.yml'
  workflow_dispatch:

# 同一時間只跑一個，避免兩次更新互相干擾
concurrency:
  group: db-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PGURL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v4

      - name: 檢查設定
        run: |
          if [ -z "$PGURL" ]; then
            echo "::error::還沒設定 GitHub Secret「SUPABASE_DB_URL」。請到 repo → Settings → Secrets and variables → Actions → Secrets 新增（Supabase → Connect → Session pooler 的連線字串）。"
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version

      - name: 連線測試
        run: |
          # 先檢查常見的填錯（訊息裡不會印出連線字串）
          case "$PGURL" in
            *'[YOUR-PASSWORD]'*|*'YOUR-PASSWORD'*) echo "::error::連線字串裡還是「[YOUR-PASSWORD]」，請換成資料庫密碼（不要保留方括號）。"; exit 1;;
            *'@db.'*'.supabase.co'*) echo "::error::這是 Direct connection（只支援 IPv6，GitHub 連不到）。請改用 Supabase → Connect → Session pooler 的連線字串（主機是 aws-…pooler.supabase.com）。"; exit 1;;
            postgres://*|postgresql://*) ;;
            *) echo "::error::連線字串要以 postgresql:// 開頭（請複製 URI 格式，不是其他格式）。"; exit 1;;
          esac
          # 連線失敗時把 psql 的錯誤顯示在摘要上（連線字串一律遮掉）
          if ! err=$(psql "$PGURL" -v ON_ERROR_STOP=1 -tAc "select 'ok'" 2>&1 >/dev/null); then
            msg=$(printf '%s' "$err" | sed -E 's#postgres(ql)?://[^ "]*#<連線字串>#g' | tr '\n' ' ' | cut -c1-400)
            case "$err" in
              *'password authentication failed'*) hint='密碼不對：請確認是「資料庫密碼」（不是 Supabase 登入密碼），可在 Project Settings → Database 重設；密碼裡有 @ : / # ? % 等符號要改成網址編碼（例如 @ → %40）。';;
              *'Tenant or user not found'*) hint='使用者名稱不對：Session pooler 的使用者要是「postgres.專案代碼」，請整串重新複製。';;
              *'could not translate host name'*|*'Network is unreachable'*|*'timeout'*) hint='連不到主機：請確認用的是 Session pooler 的連線字串、專案沒有被暫停。';;
              *) hint='請確認是 Session pooler 的 URI 連線字串，且密碼正確。';;
            esac
            echo "::error::連不上資料庫：$msg"
            echo "::error::$hint"
            exit 1
          fi
          echo "目前資料庫版本：$(psql "$PGURL" -tAc 'select public.schema_version()' 2>/dev/null || echo '（舊版，沒有版本函式）')"

      - name: 執行 schema.sql（單一交易，出錯全部復原）
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 --single-transaction -q -f supabase/schema.sql \
            || { echo "::error::schema.sql 執行失敗，資料庫已全部復原（沒有任何改動）。錯誤訊息在上面幾行。"; exit 1; }

      - name: 確認版本號
        run: |
          want=$(grep -oE 'select [0-9]+ \$\$;' supabase/schema.sql | tail -1 | grep -oE '[0-9]+')
          got=$(psql "$PGURL" -tAc 'select public.schema_version()')
          echo "檔案版本：$want　資料庫版本：$got"
          if [ "$want" != "$got" ]; then echo "::error::版本號不一致（檔案 $want，資料庫 $got）"; exit 1; fi
          # 請 Supabase API（PostgREST）重新讀取資料表結構，新的檢視表／函式馬上可以用
          psql "$PGURL" -q -c "notify pgrst, 'reload schema'"
          echo "::notice::資料庫已更新到 v$got"
